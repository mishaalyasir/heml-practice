<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

<body>
  <h1>REGISTERATION FORM</h1>
  <label for="">NAME OF APPLICANT* : </label>
  <!-- required: browser ko batata k field zaroori h
   * (asterisk): sirf user ko dikhata k field zaroori h-->
  <input type="text" placeholder="write your name" required>
  <br><br>
  <label for="">ENTER FATHER NAME : </label>
  <input type="text" placeholder="write father name">
  <br><br>
  <label for="">ENTER YOUR PASSWORD : </label>
  <input type="password" placeholder="password">
  <br><br>
  <label for="">ENTER YOUR EMAIL : </label>
  <input type="email" placeholder="write an email">
  <br><br>
  <label for="">ENTER YOUR NUMBER : </label>
  <input type="number" placeholder="write a number">
  <br><br>
  <label for="">EDUCATION : </label>
  <br>
  <label for="">fsc</label>
  <input type="checkbox" name="" id="">
  <label for="">bsc</label>
  <input type="checkbox" name="" id="">
  <label for="">Ms</label>
  <input type="checkbox" name="" id="">
  <br><br>
  <label for="">SELECT DATE AND TIME : </label>
  <input type="datetime-local" name="" id="">
  <br><br>
  <label for="">UPLOAD DOCUMENTS : </label>
  <input type="file">
  <br><br>
  <label for="">SELECT DAYS : </label>
  <select name="" id="">
    <option value="">mon</option>
    <option value="">tue</option>
    <option value="">wed</option>
  </select>
  <br><br>
  <label for="">CHOOSE UNIFORM COLOR : </label>
  <input type="color" name="" id="">
  <br><br>
  <label for="">CHOOSE COURSE :</label>
  <br>
  <input type="radio" name="" id="">
  <label for="">graphic designing</label>
  <input type="radio" name="" id="">
  <label for="">ms office</label>
  <input type="radio" name="" id="">
  <label for="">youtube automation</label>
  <br><br>
  <label for="">EXPERIENCE LEVEL :</label>
  <input type="range" name="" id="">
  <br><br> <input type="button" value="submit">
</body>
